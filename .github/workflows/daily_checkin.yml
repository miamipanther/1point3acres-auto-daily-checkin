# .github/workflows/daily_checkin.yml
name: 每日签到 - 可扩展为多账户

on:
  schedule:
    # UTC 每日 00:30，折合北京时间 08:30
    - cron: '30 0 * * *'
  workflow_dispatch:  # 允许你手动点 Run workflow

jobs:
  sign:
    runs-on: ubuntu-latest

    # 如果需要多账户支持，可以取消下面的注释，并在 GitHub Actions 环境中配置对应的 Secrets
    ### 多账户支持
    # strategy:
    #   matrix:
    #     env: [account1env, account2env, account3env]  # 可根据需要添加更多账户/GitHub Actions 环境

    # # 动态切换到 matrix.env 对应的 Environment
    # environment: ${{ matrix.env }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成 config.toml
        env:
          MY_COOKIES: ${{ secrets.COOKIES }}
          MY_CAPTCHA_KEY: ${{ secrets.CAPTCHA_KEY }}
          MY_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          python -c '
          import os

          # Clean up any potential "Cookie: " prefix accidentally copied from Safari
          raw_cookie = os.environ.get("MY_COOKIES", "").strip()
          if raw_cookie.lower().startswith("cookie:"):
              raw_cookie = raw_cookie[7:].strip()

          # Build a clean python dictionary mapping to the configuration structure
          config_dict = {
              "cookie": raw_cookie,
              "captcha_key": os.environ.get("MY_CAPTCHA_KEY", ""),
              "username": os.environ.get("USERNAME", ""),
              "password": os.environ.get("MY_PASSWORD", ""),
              "timeout": 20,
              "min_wait": 1.0,
              "max_wait": 3.0
          }

          # Write out properly formatted TOML fields manually to guarantee structural validity
          with open("config.toml", "w", encoding="utf-8") as f:
              for key, val in config_dict.items():
                  if isinstance(val, str):
                      # Use a python double-quote escape sequence representation for safest translation
                      escaped_val = val.replace("\\", "\\\\").replace("\"", "\\\"")
                      f.write(f"{key} = \"{escaped_val}\"\n")
                  else:
                      f.write(f"{key} = {val}\n")
          '
      - name: 执行签到脚本
        run: |
          sleep $((RANDOM % 300))  # 随机延迟 0～300 秒
          python -m scripts.run_sign
